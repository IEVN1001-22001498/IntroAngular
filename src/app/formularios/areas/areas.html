<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
    <div class="row">
        <div class="col-6">
            <form>
                <div class="form-group pt-4">
                    <label><strong>Selecciona la figura geométrica:</strong></label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="figura" [(ngModel)]="tipoFigura" value="cuadrado" id="cuadrado">
                        <label class="form-check-label" for="cuadrado">Cuadrado (Área = Lado × Lado)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="figura" [(ngModel)]="tipoFigura" value="rectangulo" id="rectangulo">
                        <label class="form-check-label" for="rectangulo">Rectángulo (Área = Base × Altura)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="figura" [(ngModel)]="tipoFigura" value="circulo" id="circulo">
                        <label class="form-check-label" for="circulo">Círculo (Área = π × Radio²)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="figura" [(ngModel)]="tipoFigura" value="pentagono" id="pentagono">
                        <label class="form-check-label" for="pentagono">Pentágono (Área = (Perímetro × Apotema) / 2)</label>
                    </div>
                </div>
                <div class="form-group pt-4">
                    <label for="val1">Valor 1 (Lado / Base / Radio / Perímetro):</label>
                    <input [(ngModel)]="valor1" name="valor1" type="text" class="form-control" id="val1" placeholder="Ingrese primer valor">
                </div>
                
                <div class="form-group pt-4" *ngIf="tipoFigura === 'rectangulo' || tipoFigura === 'pentagono'">
                    <label for="val2">Valor 2 (Altura / Apotema):</label>
                    <input [(ngModel)]="valor2" name="valor2" type="text" class="form-control" id="val2" placeholder="Ingrese segundo valor">
                </div>

                <br>
                <button (click)="calcularArea()" type="button" class="btn btn-primary">
                    Calcular Área
                </button>
            </form>
        </div>
        <div class="col-6">
            <h2>Resultado del Área: {{resultado}}</h2>
        </div>
    </div>
</div>
</body>
</html>
