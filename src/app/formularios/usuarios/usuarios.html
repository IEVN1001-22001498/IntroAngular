<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 border p-4 rounded shadow-sm">
            <h3 class="text-center mb-4">Inicio de Sesión</h3>
            
            <form>
                <div class="form-group mb-3">
                    <label for="usuario">Usuario:</label>
                    <input [(ngModel)]="usuarioIngresado" name="usuarioIngresado" type="text" class="form-control" id="usuario" placeholder="Ingrese usuario">
                </div>

                <div class="form-group mb-3">
                    <label for="password">Contraseña:</label>
                    <input [(ngModel)]="passwordIngresado" name="passwordIngresado" type="password" class="form-control" id="password" placeholder="Ingrese contraseña">
                </div>

                <div class="text-center pt-2">
                    <button (click)="validarAcceso()" type="button" class="btn btn-primary">
                        Iniciar sesión
                    </button>
                </div>
            </form>

            <div class="mt-4 text-center" *ngIf="mensaje">
                <p class="fw-bold">{{ mensaje }}</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
