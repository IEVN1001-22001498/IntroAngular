<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinepolis</title>
</head>
<body>
    <div class="pantalla-fondo">
      <div class="ventana-principal">
        <div class="titulo-cinepolis">Cinepolis</div>
        <div class="contenido-grid">
          <fieldset class="marco entradas">
            <legend>Entradas</legend>
            <div class="fila">
              <label>Nombre</label>
              <input type="text" [(ngModel)]="nombre">
            </div>
            <div class="fila">
              <label>Cantidad Compradores</label>
              <input type="number" [(ngModel)]="cantidadCompradores" min="1">
            </div>
            <div class="fila">
              <label>Tarjeta Cineco</label>
              <div class="radios">
                <label><input type="radio" name="tarjeta" [value]="true" [(ngModel)]="tarjeta"> Sí</label>
                <label><input type="radio" name="tarjeta" [value]="false" [(ngModel)]="tarjeta"> No</label>
              </div>
            </div>
            <div class="fila">
              <label>Cantidad De Boletas</label>
              <input type="number" [(ngModel)]="cantidad" min="1" [max]="cantidadCompradores * 7" />
            </div>
          </fieldset>
          <fieldset class="marco salidas">
            <legend>Salidas</legend>
            <div class="fila-salida">
              <label>Valor a Pagar</label>
              <input type="text" [value]="resultado" readonly class="input-resultado">
            </div>
          </fieldset>
        </div>
        <fieldset class="marco acciones">
          <legend>Acciones</legend>
          <div class="botones">
            <button (click)="procesar()">Procesar</button>
            <button (click)="limpiar()">Salir</button>
          </div>
        </fieldset>

      </div>
    </div>
</body>
</html>
